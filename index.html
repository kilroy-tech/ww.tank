<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilroy Tank Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        #lobbyScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        #lobbyScreen h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #lobbyScreen p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .lobby-form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        
        #usernameInput {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        #usernameInput::placeholder {
            color: #999;
        }
        
        #joinBtn {
            padding: 12px 30px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #joinBtn:hover {
            background: #ff5252;
        }
        
        #joinBtn:active {
            transform: scale(0.98);
        }

        #joinBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lobby-status {
            font-size: 0.95em;
        }

        .lobby-status.error {
            color: #ffd0d0;
            font-weight: bold;
        }
        
        #gameScreen {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        
        #gameInfo {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #667eea;
            border-radius: 4px;
            background: #000;
            aspect-ratio: 4 / 3;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 2px;
        }
        
        .controls {
            text-align: center;
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 10px;
        }

        #joystick {
            display: none;
            position: relative;
            align-self: center;
            width: 120px;
            height: 120px;
            border: 2px solid #8a9ff5;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.16);
            touch-action: none;
            user-select: none;
        }

        #joystick-knob {
            position: absolute;
            width: 44px;
            height: 44px;
            top: 50%;
            left: 50%;
            margin: -22px;
            border-radius: 50%;
            background: #8a9ff5;
            pointer-events: none;
        }

        @media (pointer: coarse) {
            #joystick { display: block; }
        }
        
        #leaveBtn {
            align-self: center;
            padding: 8px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #leaveBtn:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lobby Screen -->
        <div id="lobbyScreen">
            <h1>⚔️ TANK BATTLE</h1>
            <p>Enter your name to join the battlefield</p>
            <div class="lobby-form">
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="Enter your name"
                    maxlength="20"
                >
                <button id="joinBtn" disabled>JOIN</button>
            </div>
            <p id="lobbyStatus" class="lobby-status" role="status">Connecting...</p>
        </div>
        
        <!-- Game Screen -->
        <div id="gameScreen">
            <div id="gameInfo">
                <span>Player: <strong id="playerName"></strong></span>
                <span>Tanks on field: <strong id="tankCount">1</strong></span>
            </div>
            <div id="canvasContainer">
                <canvas id="gameCanvas"></canvas>
            </div>
            <div id="joystick" role="img" aria-label="Touch joystick for moving and turning">
                <div id="joystick-knob"></div>
            </div>
            <div class="controls">
                <strong>Controls:</strong> WASD to move, rotate | SPACE to shoot (coming soon) | ESC to leave
            </div>
            <button id="leaveBtn">LEAVE GAME</button>
        </div>
    </div>

    <script type="module">
        import { initWebWidget } from "/apps/kilroy.utils/lib/kilroy/js/webwidget_sdk.js";

        // ==================== CONFIGURATION ====================
        const CONFIG = {
            CANVAS_WIDTH: 800,
            CANVAS_HEIGHT: 600,
            TANK_SIZE: 20,
            TANK_SPEED: 200,           // pixels per second
            TANK_ROTATION_SPEED: 180,  // degrees per second
            SEND_UPDATE_INTERVAL: 100, // ms between network updates
            PLAYER_TIMEOUT: 5000,      // ms to remove inactive player
            MESSAGE_PREFIX: '/ww.tank ',
            FILTERS: ['^/ww\\.tank '],
            MAX_NAME: 20
        };

        // ==================== STATE ====================
        const gameState = {
            username: null,
            localTank: null,
            remoteTanks: new Map(),      // username -> { name, x, y, orientation, lastUpdate }
            keys: {},
            touchKeys: {},
            lastSendTime: 0,
            lastHeartbeatTime: 0,
            lastSentPosition: { x: null, y: null, orientation: null },
            isInGame: false
        };

        const params = new URLSearchParams(window.location.search);
        const alias = (params.get('alias') || '').trim();
        const groupName = (params.get('group_name') || '').trim();
        let sdk = null;
        let connected = false;
        let ready = false;
        let closed = false;
        const subscriptions = [];

        function freshLocalTank() {
            return {
                x: CONFIG.CANVAS_WIDTH / 2,
                y: CONFIG.CANVAS_HEIGHT / 2,
                orientation: 0,           // degrees (0 = right, 90 = down)
                velocityX: 0,
                velocityY: 0,
                rotationVelocity: 0       // degrees per second
            };
        }
        gameState.localTank = freshLocalTank();

        // ==================== UTILITY FUNCTIONS ====================

        function hashToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash; // Convert to 32-bit integer
            }
            
            // Ensure we get bright, distinct colors
            const hue = (hash % 360);
            const saturation = 70 + (Math.abs(hash) % 30);
            const lightness = 50 + (Math.abs(hash >> 8) % 20);
            
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        /**
         * Normalize angle to 0-360 range
         */
        function normalizeAngle(angle) {
            while (angle < 0) angle += 360;
            return angle % 360;
        }

        /**
         * Convert degrees to radians
         */
        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        // ==================== UI EVENTS ====================

        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const lobbyStatus = document.getElementById('lobbyStatus');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const playerNameDisplay = document.getElementById('playerName');
        const tankCountDisplay = document.getElementById('tankCount');
        const leaveBtn = document.getElementById('leaveBtn');

        joinBtn.addEventListener('click', joinGame);
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinGame();
        });
        leaveBtn.addEventListener('click', leaveGame);

        function setStatus(text, isError = false) {
            lobbyStatus.textContent = text;
            lobbyStatus.classList.toggle('error', isError);
        }

        function updateControls() {
            joinBtn.disabled = closed || !ready || !connected;
        }

        // ==================== GAME FLOW ====================

        function joinGame() {
            const username = usernameInput.value.trim().slice(0, CONFIG.MAX_NAME);
            if (!username) {
                usernameInput.focus();
                return;
            }
            if (joinBtn.disabled) return;

            gameState.username = username;
            gameState.isInGame = true;
            playerNameDisplay.textContent = username;

            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';

            startGameLoop();
        }

        function leaveGame() {
            gameState.isInGame = false;
            stopGameLoop();
            gameState.remoteTanks.clear();
            gameState.localTank = freshLocalTank();
            gameState.lastSentPosition = { x: null, y: null, orientation: null };
            gameState.lastHeartbeatTime = 0;
            gameState.keys = {};
            resetJoystick();

            gameScreen.style.display = 'none';
            lobbyScreen.style.display = 'flex';
            usernameInput.value = '';
            usernameInput.focus();
        }

        // ==================== WEBWIDGET INTEGRATION ====================

        function isFiniteNumber(value) {
            return typeof value === 'number' && Number.isFinite(value);
        }

        function handleIncoming(event) {
            if (closed || !gameState.isInGame || typeof event.message !== 'string') return;
            if (!event.message.startsWith(CONFIG.MESSAGE_PREFIX)) return;

            let update;
            try {
                update = JSON.parse(event.message.slice(CONFIG.MESSAGE_PREFIX.length));
            } catch (_err) {
                return;
            }
            if (!update || typeof update !== 'object') return;

            const name = typeof update.username === 'string' ? update.username.trim().slice(0, CONFIG.MAX_NAME) : '';
            if (!name || !isFiniteNumber(update.x) || !isFiniteNumber(update.y) || !isFiniteNumber(update.orientation)) return;

            gameState.remoteTanks.set(name, {
                name,
                x: Math.max(0, Math.min(CONFIG.CANVAS_WIDTH, update.x)),
                y: Math.max(0, Math.min(CONFIG.CANVAS_HEIGHT, update.y)),
                orientation: normalizeAngle(update.orientation),
                lastUpdate: Date.now()
            });
        }

        function sendTankUpdate() {
            if (!sdk || !ready || !connected) return;

            const now = Date.now();
            const newX = Math.round(gameState.localTank.x);
            const newY = Math.round(gameState.localTank.y);
            const newOrientation = Math.round(gameState.localTank.orientation);

            const positionChanged =
                gameState.lastSentPosition.x !== newX ||
                gameState.lastSentPosition.y !== newY ||
                gameState.lastSentPosition.orientation !== newOrientation;

            // Heartbeat every 4s keeps this tank from timing out on peers.
            if (!positionChanged && now - gameState.lastHeartbeatTime < 4000) return;
            if (now - gameState.lastSendTime < CONFIG.SEND_UPDATE_INTERVAL) return;

            gameState.lastSendTime = now;
            gameState.lastHeartbeatTime = now;
            gameState.lastSentPosition = { x: newX, y: newY, orientation: newOrientation };

            const update = {
                username: gameState.username,
                x: newX,
                y: newY,
                orientation: newOrientation
            };

            sdk.sendMessage(CONFIG.MESSAGE_PREFIX + JSON.stringify(update), {
                username: gameState.username,
                type: 'text/plain'
            }).catch((err) => {
                console.warn('[tank] send failed', err);
            });
        }

        function closeWidget() {
            if (closed) return;
            closed = true;
            ready = false;
            gameState.isInGame = false;
            resetJoystick();
            stopGameLoop();
            subscriptions.forEach((unsubscribe) => unsubscribe());
            if (sdk) sdk.disconnect();
            setStatus('Closed');
            updateControls();
        }

        async function initWidget() {
            if (!alias || !groupName) {
                setStatus('Configuration error: this widget must be launched by Kilroy (missing alias or group_name).', true);
                updateControls();
                return;
            }
            try {
                sdk = initWebWidget({ focusBridgeEnabled: true, targetOrigin: window.location.origin });
                connected = sdk.connected;
                subscriptions.push(sdk.onConnectionState((event) => {
                    connected = !!event.connected;
                    if (ready) setStatus(connected ? 'Connected' : 'Disconnected', !connected);
                    updateControls();
                }));
                subscriptions.push(sdk.onMessage(handleIncoming));
                subscriptions.push(sdk.onLifecycle(({ event }) => {
                    if (event === 'WIDGET_CLOSING') closeWidget();
                }));
                await sdk.ready;
                await sdk.setMessageFilters(CONFIG.FILTERS);
                if (closed) return;
                connected = sdk.connected;
                ready = true;
                setStatus(connected ? 'Connected' : 'Disconnected', !connected);
            } catch (err) {
                setStatus('Initialization failed: ' + (err?.message || err), true);
            }
            updateControls();
        }

        // ==================== INPUT HANDLING ====================

        const joystick = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickPointer = null;

        function resetJoystick() {
            joystickPointer = null;
            gameState.touchKeys = {};
            joystickKnob.style.transform = '';
        }

        function updateJoystick(event) {
            const rect = joystick.getBoundingClientRect();
            const radius = Math.min(rect.width, rect.height) / 2;
            let x = (event.clientX - (rect.left + rect.width / 2)) / radius;
            let y = (event.clientY - (rect.top + rect.height / 2)) / radius;
            const distance = Math.hypot(x, y);
            if (distance > 1) {
                x /= distance;
                y /= distance;
            }
            const deadZone = 0.25;
            gameState.touchKeys = { W: y < -deadZone, S: y > deadZone, A: x < -deadZone, D: x > deadZone };
            const travel = Math.max(0, radius - joystickKnob.offsetWidth / 2);
            joystickKnob.style.transform = `translate(${x * travel}px, ${y * travel}px)`;
        }

        joystick.addEventListener('pointerdown', (event) => {
            if (!gameState.isInGame || joystickPointer !== null) return;
            event.preventDefault();
            joystickPointer = event.pointerId;
            joystick.setPointerCapture(event.pointerId);
            updateJoystick(event);
        });
        joystick.addEventListener('pointermove', (event) => {
            if (event.pointerId === joystickPointer) updateJoystick(event);
        });
        for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
            joystick.addEventListener(eventName, (event) => {
                if (event.pointerId === joystickPointer) resetJoystick();
            });
        }
        window.addEventListener('blur', () => {
            gameState.keys = {};
            resetJoystick();
        });

        document.addEventListener('keydown', (e) => {
            if (!gameState.isInGame) return;
            gameState.keys[e.key.toUpperCase()] = true;

            if (e.key === 'Escape') {
                leaveGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key.toUpperCase()] = false;
        });

        window.addEventListener('pagehide', (event) => {
            if (!event.persisted) closeWidget();
        });

        // ==================== GAME LOOP ====================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId = null;

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            const rect = container.getBoundingClientRect();
            canvas.width = Math.floor(rect.width) || CONFIG.CANVAS_WIDTH;
            canvas.height = Math.floor(rect.height) || CONFIG.CANVAS_HEIGHT;
        }

        function startGameLoop() {
            stopGameLoop();
            setTimeout(resizeCanvas, 50);
            window.addEventListener('resize', resizeCanvas);
            gameLoopId = setInterval(gameLoop, 1000 / 60);
        }

        function stopGameLoop() {
            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = null;
            window.removeEventListener('resize', resizeCanvas);
        }

        function gameLoop() {
            if (!gameState.isInGame) {
                stopGameLoop();
                return;
            }

            updateLocalTank(1 / 60);
            removeStaleRemoteTanks();
            sendTankUpdate();
            render();

            tankCountDisplay.textContent = gameState.remoteTanks.size + 1;
        }

        function updateLocalTank(deltaTime) {
            const tank = gameState.localTank;

            // Reset velocity
            tank.velocityX = 0;
            tank.velocityY = 0;
            tank.rotationVelocity = 0;

            // Input handling
            const keys = {
                W: gameState.keys.W || gameState.touchKeys.W,
                S: gameState.keys.S || gameState.touchKeys.S,
                A: gameState.keys.A || gameState.touchKeys.A,
                D: gameState.keys.D || gameState.touchKeys.D
            };
            
            // Forward (W)
            if (keys['W']) {
                const rad = toRadians(tank.orientation);
                tank.velocityX += Math.cos(rad) * CONFIG.TANK_SPEED;
                tank.velocityY += Math.sin(rad) * CONFIG.TANK_SPEED;
            }

            // Backward (S)
            if (keys['S']) {
                const rad = toRadians(tank.orientation);
                tank.velocityX -= Math.cos(rad) * CONFIG.TANK_SPEED;
                tank.velocityY -= Math.sin(rad) * CONFIG.TANK_SPEED;
            }

            // Rotate counter-clockwise (A)
            if (keys['A']) {
                tank.rotationVelocity = -CONFIG.TANK_ROTATION_SPEED;
            }

            // Rotate clockwise (D)
            if (keys['D']) {
                tank.rotationVelocity = CONFIG.TANK_ROTATION_SPEED;
            }

            // Update position
            tank.x += tank.velocityX * deltaTime;
            tank.y += tank.velocityY * deltaTime;

            // Update orientation
            tank.orientation = normalizeAngle(tank.orientation + tank.rotationVelocity * deltaTime);

            // Clamp to canvas bounds
            tank.x = Math.max(CONFIG.TANK_SIZE, Math.min(CONFIG.CANVAS_WIDTH - CONFIG.TANK_SIZE, tank.x));
            tank.y = Math.max(CONFIG.TANK_SIZE, Math.min(CONFIG.CANVAS_HEIGHT - CONFIG.TANK_SIZE, tank.y));
        }

        function removeStaleRemoteTanks() {
            const now = Date.now();
            for (const [name, tank] of gameState.remoteTanks) {
                if (now - tank.lastUpdate > CONFIG.PLAYER_TIMEOUT) {
                    gameState.remoteTanks.delete(name);
                }
            }
        }

        function render() {
            if (!canvas.width || !canvas.height) {
                resizeCanvas();
                if (!canvas.width || !canvas.height) return;
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            const scaleX = canvas.width / CONFIG.CANVAS_WIDTH;
            const scaleY = canvas.height / CONFIG.CANVAS_HEIGHT;

            drawTank(gameState.localTank, '#4299ff', true, scaleX, scaleY);

            for (const tank of gameState.remoteTanks.values()) {
                drawTank(tank, hashToColor(tank.name), false, scaleX, scaleY);
            }
        }

        function drawTank(tank, color, isLocal, scaleX, scaleY) {
            const size = CONFIG.TANK_SIZE * Math.min(scaleX, scaleY);
            const x = tank.x * scaleX;
            const y = tank.y * scaleY;
            const rad = toRadians(tank.orientation);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rad);

            // Tank body (rectangle)
            ctx.fillStyle = color;
            ctx.fillRect(-size * 0.4, -size * 0.5, size * 0.8, size);

            // Tank turret (circle)
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
            ctx.fill();

            // Turret outline
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
            ctx.stroke();

            // Gun barrel
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(size * 0.6, 0);
            ctx.stroke();

            ctx.restore();

            // Draw player label below tank (if remote)
            if (!isLocal) {
                ctx.fillStyle = '#fff';
                ctx.font = '11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(tank.name, x, y + size + 12);
            }
        }

        initWidget();
    </script>
</body>
</html>
